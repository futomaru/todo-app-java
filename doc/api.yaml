openapi: 3.0.3

info:
  title: Todo App API
  version: 0.1.0
  description: |
    学習用 Todo アプリの REST API 仕様（MVP）。

    - 実行基盤: Spring Boot 4.1.x / Spring Framework 7.1.x / JDK 25
    - 設計の意図・背景: [doc/design.md](./design.md)
    - スコープ: TodoMVC 相当のコア機能のみ（design.md §1.1）
    - エラー形式: RFC 7807 `application/problem+json`（design.md §6.2）

    ### 日時フォーマットについて
    `createdAt` / `updatedAt` はサーバー側で `java.time.LocalDateTime` として保持し、
    Jackson のデフォルト設定で **タイムゾーンオフセットを持たない ISO 8601** 形式の文字列としてシリアライズされる
    （例: `2026-06-02T10:00:00`）。OpenAPI の `format: date-time`（RFC 3339）は本来オフセットを要求するが、
    本 MVP では学習用途のため `LocalDateTime` をそのまま採用している。
  contact:
    name: futomaru
  license:
    name: Unlicensed (学習用途)

servers:
  - url: http://localhost:8080
    description: ローカル開発サーバー

tags:
  - name: todos
    description: Todo リソースに対する CRUD 操作

paths:
  /api/v1/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: Todo 一覧取得
      description: |
        Todo を全件取得する。`completed` クエリで完了状態によるフィルターが可能。
        並び順は `id` 昇順（挿入順）。
      parameters:
        - name: completed
          in: query
          required: false
          description: |
            完了状態によるフィルター。未指定なら全件。
            - `true` : 完了済みのみ
            - `false`: 未完了のみ
          schema:
            type: boolean
      responses:
        '200':
          description: 取得成功（0 件の場合は空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoResponse'
              examples:
                two-items:
                  summary: 2 件取得した例
                  value:
                    - id: 1
                      title: 買い物
                      description: 牛乳とパン
                      completed: false
                      createdAt: '2026-06-02T10:00:00'
                      updatedAt: '2026-06-02T10:00:00'
                    - id: 2
                      title: 部屋掃除
                      description: null
                      completed: true
                      createdAt: '2026-06-01T08:30:00'
                      updatedAt: '2026-06-02T09:15:00'
                empty:
                  summary: 0 件の例
                  value: []

    post:
      tags: [todos]
      operationId: createTodo
      summary: Todo 新規作成
      description: |
        新しい Todo を作成する。`completed` はサーバー側で常に `false` から開始し、リクエストから受け取らない。
        `createdAt` / `updatedAt` はサーバー側で `Clock` から取得した同一時刻が設定される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
            examples:
              with-description:
                summary: タイトル + 説明を指定
                value:
                  title: 買い物
                  description: 牛乳とパン
              title-only:
                summary: タイトルのみ（description 省略）
                value:
                  title: 買い物
      responses:
        '201':
          description: 作成成功
          headers:
            Location:
              description: 作成されたリソースの URI
              schema:
                type: string
                example: /api/v1/todos/2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 2
                title: 買い物
                description: 牛乳とパン
                completed: false
                createdAt: '2026-06-02T10:00:00'
                updatedAt: '2026-06-02T10:00:00'
        '400':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [todos]
      operationId: deleteCompletedTodos
      summary: 完了済み Todo の一括削除
      description: |
        `completed = true` の Todo をすべて削除する（TodoMVC の "Clear completed" 相当）。

        **仕様上のポイント**（詳細は design.md §6.3 参照）:
        - マッチ 0 件でも `204` を返す（コレクション削除は空集合操作も成功扱い）。
        - 単一 `DELETE /api/v1/todos/{id}` が `404` を返すのとは意味論が異なる。
        - `?completed=false`（未完了の一括削除）は誤操作リスクが高いため意図的に未対応。
      parameters:
        - name: completed
          in: query
          required: true
          description: 削除対象のフィルター。本 MVP では `true` のみ受け付ける。
          schema:
            type: boolean
            enum: [true]
      responses:
        '204':
          description: 削除成功（マッチ 0 件でも 204）
        '400':
          description: |
            `completed` が未指定、または `true` 以外の値が指定された場合。
            実装上は内部例外が分かれる（詳細は design.md §6.2 の対応表参照）:
            - 未指定 → `MissingServletRequestParameterException` → `detail: "Required parameter 'completed' is not present"`
            - `false` など `true` 以外 → `HandlerMethodValidationException`（`@AssertTrue` 違反）
              → `detail: "Validation failed"` + `errors[]`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                missing:
                  summary: completed クエリ未指定
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: "Required parameter 'completed' is not present"
                    instance: /api/v1/todos
                invalid:
                  summary: completed=false など true 以外
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    detail: Validation failed
                    instance: /api/v1/todos
                    errors:
                      - field: completed
                        message: must be true

  /api/v1/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoIdParam'

    get:
      tags: [todos]
      operationId: getTodoById
      summary: Todo 1 件取得
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 1
                title: 買い物
                description: 牛乳とパン
                completed: false
                createdAt: '2026-06-02T10:00:00'
                updatedAt: '2026-06-02T10:00:00'
        '400':
          $ref: '#/components/responses/InvalidPathId'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [todos]
      operationId: updateTodo
      summary: Todo 部分更新
      description: |
        指定されたフィールドのみを更新する PATCH セマンティクス。
        - リクエストに含まれない / `null` のフィールドは **更新しない**。
        - `completed` を `Boolean`（ラッパー型）で扱うのは「未指定（null）」と「false 指定」を区別するため。
        - `updatedAt` はサーバー側で `Clock` から取得した時刻に更新される。
        - `title` は空文字を許可しない（@Size(min=1)）。null は「未指定」を意味する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
            examples:
              toggle-complete:
                summary: 完了フラグのみトグル
                value:
                  completed: true
              update-title:
                summary: タイトルのみ更新
                value:
                  title: 買い物（更新）
              update-multiple:
                summary: 複数フィールド更新
                value:
                  title: 買い物（更新）
                  completed: true
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
              example:
                id: 1
                title: 買い物（更新）
                description: 牛乳とパン
                completed: true
                createdAt: '2026-06-02T10:00:00'
                updatedAt: '2026-06-02T11:30:00'
        '400':
          description: |
            リクエストボディのバリデーション失敗（`@Size` 違反など）、
            または `id` が 1 未満（`@PathVariable @Min(1)` 違反）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [todos]
      operationId: deleteTodoById
      summary: Todo 1 件削除
      description: |
        指定 `id` の Todo を削除する。存在しない場合は `404` を返す
        （冪等性より「存在チェック → 例外スロー → ExceptionHandler で 404」という
        Spring の典型フローを優先する設計判断。design.md §6.3 参照）。
      responses:
        '204':
          description: 削除成功（ボディなし）
        '400':
          $ref: '#/components/responses/InvalidPathId'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    TodoIdParam:
      name: id
      in: path
      required: true
      description: Todo の主キー
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  schemas:

    TodoResponse:
      type: object
      description: |
        Todo のレスポンス表現。サーバー → クライアント方向の API 境界で使用する不変 record。
        DB の `todos` テーブル（design.md §5.1）と 1:1 で対応する。
      required:
        - id
        - title
        - completed
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: 主キー（DB の AUTO_INCREMENT で採番）
          example: 1
        title:
          type: string
          maxLength: 255
          description: タスク名（DB 列 `title VARCHAR(255) NOT NULL` と対応）
          example: 買い物
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: 詳細説明（DB 列 `description VARCHAR(1000)` と対応。NULL 可）
          example: 牛乳とパン
        completed:
          type: boolean
          description: 完了フラグ（DB 列 `completed BOOLEAN NOT NULL DEFAULT FALSE` と対応）
          example: false
        createdAt:
          type: string
          format: date-time
          description: |
            作成日時。サーバー側で `LocalDateTime.now(clock)` により設定される。
            タイムゾーンオフセットは含まれない（info 冒頭の注意書き参照）。
          example: '2026-06-02T10:00:00'
        updatedAt:
          type: string
          format: date-time
          description: 更新日時。作成時は createdAt と同値。
          example: '2026-06-02T10:00:00'

    TodoCreateRequest:
      type: object
      description: |
        Todo 作成リクエスト（POST のリクエストボディ）。
        `completed` / `createdAt` / `updatedAt` / `id` はサーバー側で決定するため受け取らない。
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            タスク名。Bean Validation 制約: `@NotBlank @Size(max=255)`。
            空文字・空白のみ・null はすべて 400 で弾く。
          example: 買い物
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            詳細説明。Bean Validation 制約: `@Size(max=1000)`。
            省略 / `null` のいずれも許可（任意項目）。
          example: 牛乳とパン

    TodoUpdateRequest:
      type: object
      description: |
        Todo 部分更新リクエスト（PATCH のリクエストボディ）。
        すべてのフィールドが任意。`null` または省略されたフィールドは更新されない。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: |
            タスク名。Bean Validation 制約: `@Size(min=1, max=255)`。
            `null` は「未指定 = 更新しない」を意味する。
            **`@NotBlank` は使えない**（null も弾いてしまい PATCH セマンティクスを壊すため）。
            明示的な空文字 `""` は 400 で弾く。
          example: 買い物（更新）
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            詳細説明。Bean Validation 制約: `@Size(max=1000)`。
            `null` の解釈は「未指定 = 更新しない」とする
            （明示的な NULL 化は本 MVP ではサポートしない）。
          example: 牛乳と卵
        completed:
          type: boolean
          nullable: true
          description: |
            完了フラグ。`Boolean`（ラッパー型）で扱い、
            `null`（未指定 = 更新しない）と `false`（明示的に未完了に戻す）を区別する。
          example: true

    ProblemDetail:
      type: object
      description: |
        RFC 7807 `application/problem+json` 準拠のエラーレスポンス。
        Spring Framework 6 で導入された `org.springframework.http.ProblemDetail`
        （本プロジェクトでは Spring Framework 7.1 のものを使用）がシリアライズされる。
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          description: 問題の種別を一意に識別する URI。詳細な分類が無い場合は `about:blank`。
          example: about:blank
        title:
          type: string
          description: 問題の短い人間可読タイトル（HTTP ステータスのデフォルト文言と同等）
          example: Not Found
        status:
          type: integer
          description: HTTP ステータスコード
          example: 404
        detail:
          type: string
          description: 個別の事象に関する人間可読な説明
          example: 'Todo not found: 1'
        instance:
          type: string
          format: uri-reference
          description: 問題が発生した具体的なリクエストパス
          example: /api/v1/todos/1

    ValidationProblemDetail:
      description: |
        バリデーション失敗時（400 Bad Request）の ProblemDetail 拡張。
        `MethodArgumentNotValidException` を `@RestControllerAdvice` で捕捉し、
        `setProperty("errors", ...)` で `errors` フィールドを付加する。
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              description: フィールド単位のバリデーションエラー一覧
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    description: エラー対象のフィールド名（DTO のプロパティ名）
                    example: title
                  message:
                    type: string
                    description: Bean Validation のメッセージ
                    example: must not be blank

  responses:

    NotFound:
      description: 指定された ID のリソースが存在しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 'Todo not found: 1'
            instance: /api/v1/todos/1

    InvalidPathId:
      description: |
        パス変数 `{id}` が 1 未満（`@PathVariable @Min(1)` 違反）。
        Service / Mapper を呼ぶ前に Controller の入口で短絡する。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/v1/todos/0
            errors:
              - field: id
                message: must be greater than or equal to 1

    ValidationFailed:
      description: |
        リクエストボディのバリデーションに失敗した（@NotBlank / @Size 等の制約違反）。
        `errors` 配列にフィールド単位の詳細が入る。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Validation failed
            instance: /api/v1/todos
            errors:
              - field: title
                message: must not be blank
              - field: description
                message: size must be between 0 and 1000
