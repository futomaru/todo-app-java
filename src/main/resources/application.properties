spring.application.name=todoapp

# H2 データソース設定
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql の実行タイミング
# always を指定することで毎起動時に実行される。
# schema.sql は CREATE TABLE IF NOT EXISTS で冪等にしているため問題なし
spring.sql.init.mode=always

# MyBatis: スネークケース → キャメルケースの自動マッピングを有効化
# 例) created_at (DBカラム) → createdAt (Javaフィールド) が自動で対応する
mybatis.configuration.map-underscore-to-camel-case=true

# MyBatis が実行する SQL とバインドパラメータをDEBUGログに出力する
# Mapper インターフェースが属するパッケージを対象に指定する
logging.level.io.github.futomaru.todoapp.mapper=DEBUG

# Virtual Threads を有効化
# Tomcat のリクエスト処理スレッドが仮想スレッドに切り替わり、スレッドのブロッキングコストが大幅に下がる
spring.threads.virtual.enabled=true

# H2 コンソール（ブラウザから DB を直接操作できる開発ツール）
# 本番環境では必ず false にする（セキュリティリスク）
# アクセスURL: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console