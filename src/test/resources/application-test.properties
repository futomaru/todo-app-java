# 結合テスト用プロファイル設定
# `@ActiveProfiles("test")` を付けたテストクラスで読み込まれる。
# 目的: 本番の ./data/tododb（ファイル）を汚さないため in-memory H2 に差し替える。

# H2 を in-memory モードに切替え
# DB_CLOSE_DELAY=-1 を付けると、最後の接続が閉じてもJVM終了まで DB を維持する
# （MyBatis のコネクションプール再取得でデータが消えるのを防ぐ）
spring.datasource.url=jdbc:h2:mem:tododb-it;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# main 側の schema.sql をそのまま読み込む（CREATE TABLE IF NOT EXISTS で冪等）
spring.sql.init.mode=always

# main と同じく snake_case ↔ camelCase 変換を有効化
mybatis.configuration.map-underscore-to-camel-case=true

# テスト中は H2 コンソール不要（Servlet 登録抑止 → 起動高速化）
spring.h2.console.enabled=false
